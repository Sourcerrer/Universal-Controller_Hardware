<text x="40" y="80" font-size="12.5" font-weight="normal" text-anchor="start" fill="#4a5560">Separate product beside the module family (owner, 2026-11-19): the RUT200 pattern — MediaTek MT7628 router SoC + Quectel EC200A on USB + OpenWrt. Prices at</text>
