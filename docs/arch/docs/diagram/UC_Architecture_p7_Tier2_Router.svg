<text x="48" y="539" font-size="11.5" font-weight="bold" text-anchor="start" fill="#2f5fb3">Router SoC</text>
<text x="48" y="553" font-size="10.5" font-weight="normal" text-anchor="start" fill="#1b1f24">MediaTek MT7628AN: 580 MHz MIPS 24KEc; 2.4 GHz 2×2 Wi-Fi 4 and a 5-port 10/100 switch on</text>
<text x="48" y="566.65" font-size="10.5" font-weight="normal" text-anchor="start" fill="#1b1f24">the chip — one chip does router, switch and Wi-Fi</text>
<rect x="40" y="586.3" width="560" height="44.65" rx="6" fill="#eceff3" stroke="#5a6470" stroke-width="1.6"/>
<text x="48" y="603.3" font-size="11.5" font-weight="bold" text-anchor="start" fill="#5a6470">Memory</text>
<text x="48" y="617.3" font-size="10.5" font-weight="normal" text-anchor="start" fill="#1b1f24">128 MB DDR2 · 16 MB SPI NOR (same as the RUT200)</text>
<rect x="40" y="636.9499999999999" width="560" height="58.3" rx="6" fill="#ece0ff" stroke="#6b3fb3" stroke-width="1.6"/>
<text x="48" y="653.9499999999999" font-size="11.5" font-weight="bold" text-anchor="start" fill="#6b3fb3">4G modem</text>
<text x="48" y="667.9499999999999" font-size="10.5" font-weight="normal" text-anchor="start" fill="#1b1f24">Quectel EC200A-CN, LTE Cat 4, India bands, GSM fallback, on USB (ECM) — the RUT200&#x27;s own</text>
<text x="48" y="681.5999999999999" font-size="10.5" font-weight="normal" text-anchor="start" fill="#1b1f24">modem</text>
<rect x="40" y="701.2499999999999" width="560" height="44.65" rx="6" fill="#d6f1f5" stroke="#1f7f8c" stroke-width="1.6"/>
<text x="48" y="718.2499999999999" font-size="11.5" font-weight="bold" text-anchor="start" fill="#1f7f8c">Ethernet</text>
<text x="48" y="732.2499999999999" font-size="10.5" font-weight="normal" text-anchor="start" fill="#1b1f24">2 ports from the MT7628 switch: WAN / LAN + LAN, RJ45 with magnetics</text>
<rect x="40" y="751.8999999999999" width="560" height="44.65" rx="6" fill="#dcf3e0" stroke="#2e8540" stroke-width="1.6"/>
<text x="48" y="768.8999999999999" font-size="11.5" font-weight="bold" text-anchor="start" fill="#2e8540">IO</text>
<text x="48" y="782.8999999999999" font-size="10.5" font-weight="normal" text-anchor="start" fill="#1b1f24">1 DI + 1 DO, as on the RUT200</text>
<rect x="40" y="802.5499999999998" width="560" height="44.65" rx="6" fill="#ffe8cf" stroke="#c46a00" stroke-width="1.6"/>
<text x="48" y="819.5499999999998" font-size="11.5" font-weight="bold" text-anchor="start" fill="#c46a00">Power</text>
<text x="48" y="833.5499999999998" font-size="10.5" font-weight="normal" text-anchor="start" fill="#1b1f24">9–30 V DC, reverse and surge protected; 12 V adapter supplied separately</text>
<text x="650" y="122" font-size="15" font-weight="bold" text-anchor="start" fill="#1b1f24">BOM at 100 units (INR, ESTIMATE)</text>
<rect x="650" y="134" width="990" height="26" rx="0" fill="#23303d" stroke="#23303d" stroke-width="1.4"/>
