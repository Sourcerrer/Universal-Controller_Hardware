<text x="1632" y="151.0" font-size="10.5" font-weight="bold" text-anchor="end" fill="#ffffff">INR</text>
<rect x="650" y="160" width="990" height="23" rx="0" fill="#f6f8fa" stroke="#c9d0d8" stroke-width="0.8"/>
<text x="658" y="175" font-size="10" font-weight="normal" text-anchor="start" fill="#1b1f24">MediaTek MT7628AN router SoC: 580 MHz MIPS, 2.4 GHz 2×2 Wi-Fi 4 and 5-port 10/100 switch on chip (R09, R16)</text>
<text x="1632" y="175" font-size="10" font-weight="normal" text-anchor="end" fill="#1b1f24">275</text>
<rect x="650" y="183" width="990" height="23" rx="0" fill="#ffffff" stroke="#c9d0d8" stroke-width="0.8"/>
<text x="658" y="198" font-size="10" font-weight="normal" text-anchor="start" fill="#1b1f24">128 MB DDR2 + 16 MB SPI NOR (RUT200 sizes; DDR2 prices up in 2026, R18)</text>
<text x="1632" y="198" font-size="10" font-weight="normal" text-anchor="end" fill="#1b1f24">450</text>
<rect x="650" y="206" width="990" height="23" rx="0" fill="#f6f8fa" stroke="#c9d0d8" stroke-width="0.8"/>
<text x="658" y="221" font-size="10" font-weight="normal" text-anchor="start" fill="#1b1f24">SoC power, crystals, Wi-Fi RF matching + U.FL (R18)</text>
<text x="1632" y="221" font-size="10" font-weight="normal" text-anchor="end" fill="#1b1f24">150</text>
<rect x="650" y="229" width="990" height="23" rx="0" fill="#ffffff" stroke="#c9d0d8" stroke-width="0.8"/>
<text x="658" y="244" font-size="10" font-weight="normal" text-anchor="start" fill="#1b1f24">Quectel EC200A-CN LTE Cat 4 on USB, as in the RUT200 (R16)</text>
<text x="1632" y="244" font-size="10" font-weight="normal" text-anchor="end" fill="#1b1f24">1,300</text>
<rect x="650" y="252" width="990" height="23" rx="0" fill="#f6f8fa" stroke="#c9d0d8" stroke-width="0.8"/>
<text x="658" y="267" font-size="10" font-weight="normal" text-anchor="start" fill="#1b1f24">Modem 3.8 V buck + bulk, USB ESD, SIM holder + ESD (R18)</text>
<text x="1632" y="267" font-size="10" font-weight="normal" text-anchor="end" fill="#1b1f24">175</text>
<rect x="650" y="275" width="990" height="23" rx="0" fill="#ffffff" stroke="#c9d0d8" stroke-width="0.8"/>
<text x="658" y="290" font-size="10" font-weight="normal" text-anchor="start" fill="#1b1f24">2× RJ45 with magnetics (Würth / HanRun, &lt; INR 100 each, owner) + ESD</text>
<text x="1632" y="290" font-size="10" font-weight="normal" text-anchor="end" fill="#1b1f24">230</text>
<rect x="650" y="298" width="990" height="23" rx="0" fill="#f6f8fa" stroke="#c9d0d8" stroke-width="0.8"/>
<text x="658" y="313" font-size="10" font-weight="normal" text-anchor="start" fill="#1b1f24">Power input 9–30 V: fuse, TVS, reverse FET, buck to 5 V (R18)</text>
<text x="1632" y="313" font-size="10" font-weight="normal" text-anchor="end" fill="#1b1f24">215</text>
<rect x="650" y="321" width="990" height="23" rx="0" fill="#ffffff" stroke="#c9d0d8" stroke-width="0.8"/>
<text x="658" y="336" font-size="10" font-weight="normal" text-anchor="start" fill="#1b1f24">1 DI + 1 DO (as RUT200), LEDs, reset button</text>
<text x="1632" y="336" font-size="10" font-weight="normal" text-anchor="end" fill="#1b1f24">100</text>
<rect x="650" y="344" width="990" height="23" rx="0" fill="#f6f8fa" stroke="#c9d0d8" stroke-width="0.8"/>
<text x="658" y="359" font-size="10" font-weight="normal" text-anchor="start" fill="#1b1f24">SMA ×3 + pigtails; antennas in the box: 2× LTE + 1× Wi-Fi (R18)</text>
<text x="1632" y="359" font-size="10" font-weight="normal" text-anchor="end" fill="#1b1f24">440</text>
<rect x="650" y="367" width="990" height="23" rx="0" fill="#ffffff" stroke="#c9d0d8" stroke-width="0.8"/>
<text x="658" y="382" font-size="10" font-weight="normal" text-anchor="start" fill="#1b1f24">PCB 4-layer ≈ 100 × 80 mm, passives</text>
<text x="1632" y="382" font-size="10" font-weight="normal" text-anchor="end" fill="#1b1f24">240</text>
<rect x="650" y="390" width="990" height="23" rx="0" fill="#f6f8fa" stroke="#c9d0d8" stroke-width="0.8"/>
<text x="658" y="405" font-size="10" font-weight="normal" text-anchor="start" fill="#1b1f24">Enclosure DIN / wall, plastic V-0 (aluminium ≈ +250); packaging, power pigtail, label</text>
<text x="1632" y="405" font-size="10" font-weight="normal" text-anchor="end" fill="#1b1f24">200</text>
<rect x="650" y="413" width="990" height="22" rx="0" fill="#ffffff" stroke="#c9d0d8" stroke-width="0.8"/>
<text x="658" y="428.0" font-size="10.5" font-weight="normal" text-anchor="start" fill="#1b1f24">BOM</text>
<text x="1632" y="428.0" font-size="10.5" font-weight="normal" text-anchor="end" fill="#1b1f24">3,775</text>
<rect x="650" y="435" width="990" height="22" rx="0" fill="#ffffff" stroke="#c9d0d8" stroke-width="0.8"/>
<text x="658" y="450.0" font-size="10.5" font-weight="normal" text-anchor="start" fill="#1b1f24">+ Mfg, packing, logistics 50 %</text>
<text x="1632" y="450.0" font-size="10.5" font-weight="normal" text-anchor="end" fill="#1b1f24">1,888</text>
<rect x="650" y="457" width="990" height="22" rx="0" fill="#ffffff" stroke="#c9d0d8" stroke-width="0.8"/>
<text x="658" y="472.0" font-size="10.5" font-weight="normal" text-anchor="start" fill="#1b1f24">+ Firmware royalty</text>
<text x="1632" y="472.0" font-size="10.5" font-weight="normal" text-anchor="end" fill="#1b1f24">750</text>
<rect x="650" y="479" width="990" height="22" rx="0" fill="#e8f0fb" stroke="#c9d0d8" stroke-width="0.8"/>
<text x="658" y="494.0" font-size="10.5" font-weight="bold" text-anchor="start" fill="#1b1f24">= Price before profit</text>
<text x="1632" y="494.0" font-size="10.5" font-weight="bold" text-anchor="end" fill="#1b1f24">6,412</text>
<rect x="650" y="501" width="990" height="22" rx="0" fill="#ffffff" stroke="#c9d0d8" stroke-width="0.8"/>
<text x="658" y="516.0" font-size="10.5" font-weight="normal" text-anchor="start" fill="#1b1f24">+ Profit 30 %</text>
<text x="1632" y="516.0" font-size="10.5" font-weight="normal" text-anchor="end" fill="#1b1f24">1,924</text>
<rect x="650" y="523" width="990" height="22" rx="0" fill="#e8f0fb" stroke="#c9d0d8" stroke-width="0.8"/>
<text x="658" y="538.0" font-size="10.5" font-weight="bold" text-anchor="start" fill="#1b1f24">= Price after profit (ex-works)</text>
<text x="1632" y="538.0" font-size="10.5" font-weight="bold" text-anchor="end" fill="#1b1f24">8,336</text>
<text x="650" y="575" font-size="15" font-weight="bold" text-anchor="start" fill="#1b1f24">Against the Teltonika RUT200 (India)</text>
<rect x="650" y="587" width="990.0" height="26" rx="0" fill="#23303d" stroke="#23303d" stroke-width="1.4"/>
<text x="658" y="604.0" font-size="10.5" font-weight="bold" text-anchor="start" fill="#ffffff"></text>
<text x="828" y="604.0" font-size="10.5" font-weight="bold" text-anchor="start" fill="#ffffff">RUT200</text>
<text x="1238.0" y="604.0" font-size="10.5" font-weight="bold" text-anchor="start" fill="#ffffff">Ours</text>
<rect x="650" y="613" width="990" height="23" rx="0" fill="#f6f8fa" stroke="#c9d0d8" stroke-width="0.8"/>
<text x="658" y="628" font-size="10" font-weight="bold" text-anchor="start" fill="#1b1f24">Hardware</text>
<text x="828" y="628" font-size="10" font-weight="normal" text-anchor="start" fill="#1b1f24">MT7628 + EC200A, 128 / 16 MB</text>
<text x="1238.0" y="628" font-size="10" font-weight="normal" text-anchor="start" fill="#1b1f24">Same pattern and parts</text>
<rect x="650" y="636" width="990" height="23" rx="0" fill="#ffffff" stroke="#c9d0d8" stroke-width="0.8"/>
<text x="658" y="651" font-size="10" font-weight="bold" text-anchor="start" fill="#1b1f24">Ethernet / Wi-Fi</text>
<text x="828" y="651" font-size="10" font-weight="normal" text-anchor="start" fill="#1b1f24">2 × 10/100, Wi-Fi 4 2.4 GHz</text>
<text x="1238.0" y="651" font-size="10" font-weight="normal" text-anchor="start" fill="#1b1f24">Same</text>
<rect x="650" y="659" width="990" height="23" rx="0" fill="#f6f8fa" stroke="#c9d0d8" stroke-width="0.8"/>
<text x="658" y="674" font-size="10" font-weight="bold" text-anchor="start" fill="#1b1f24">Price in India</text>
<text x="828" y="674" font-size="10" font-weight="normal" text-anchor="start" fill="#1b1f24">INR 7,569–8,500 dealer, 13,700 retail</text>
<text x="1238.0" y="674" font-size="10" font-weight="normal" text-anchor="start" fill="#1b1f24">INR 8,336 ex-works, before dealer margin</text>
<rect x="650" y="682" width="990" height="23" rx="0" fill="#ffffff" stroke="#c9d0d8" stroke-width="0.8"/>
<text x="658" y="697" font-size="10" font-weight="bold" text-anchor="start" fill="#1b1f24">Software</text>
<text x="828" y="697" font-size="10" font-weight="normal" text-anchor="start" fill="#1b1f24">RutOS (OpenWrt) + RMS cloud</text>
<text x="1238.0" y="697" font-size="10" font-weight="normal" text-anchor="start" fill="#1b1f24">OpenWrt (upstream supports the RUT200 board)</text>
<text x="650" y="731" font-size="15" font-weight="bold" text-anchor="start" fill="#1b1f24">Points to decide</text>
<text x="650" y="749" font-size="10.5" font-weight="normal" text-anchor="start" fill="#1b1f24">• Security: the MT7628 has no hardware secure boot or TrustZone. Fine for the India launch; for the CRA (Phase 2) a secure SoC is needed — STM32MP135F or MediaTek</text>
<text x="662" y="762.86" font-size="10.5" font-weight="normal" text-anchor="start" fill="#1b1f24">MT7981 (R18, R20).</text>
<text x="650" y="776.72" font-size="10.5" font-weight="normal" text-anchor="start" fill="#1b1f24">• Vendor and longevity: MediaTek is outside the ST / NXP / Nordic list and publishes no longevity programme for the MT7628 (a 2014 part).</text>
<text x="650" y="790.58" font-size="10.5" font-weight="normal" text-anchor="start" fill="#1b1f24">• Radio approval: Wi-Fi is on the SoC, not a pre-certified module, so we need our own WPC approval; TEC MTCTE applies to the router.</text>
<text x="650" y="804.44" font-size="10.5" font-weight="normal" text-anchor="start" fill="#1b1f24">• Software: OpenWrt with our web UI, VPN, firewall and remote management — the main engineering cost; the earlier estimate was 18–30 engineer-months for a full</text>
<text x="662" y="818.3000000000001" font-size="10.5" font-weight="normal" text-anchor="start" fill="#1b1f24">router feature set (R18).</text>
<text x="650" y="832.1600000000001" font-size="10.5" font-weight="normal" text-anchor="start" fill="#1b1f24">• Firmware royalty taken as INR 750 per router, as for the modules.</text>
</svg>